[project]
name = "agentic-research-assistant"
version = "1.0.0"
description = "Production-grade Autonomous Agentic Research Assistant for arXiv papers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.10",
    "opensearch-py>=3.0.0",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "docling>=2.43.0",
    "python-dateutil>=2.9.0",
    "gradio>=4.0.0",
    "langfuse>=3.0.0",
    "redis>=6.0.0",
    "python-telegram-bot>=21.0,<22.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.3.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
